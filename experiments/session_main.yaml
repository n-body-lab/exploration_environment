# Main arm: one session = one team, one market, one leeway level (rounds: 1). Nothing is kept between
# sessions (session: fresh): each session is a new team. Run the same seed at each leeway level; the
# market fingerprint in summary.json (market.fingerprint) shows they played the same market.
# Needs the generator on the host: pip install -e ".[generator]" (Python >= 3.11).
name: session-main
seed: 42
duration_seconds: 900
agents:
  - {provider: anthropic, model: claude-opus-5-5, effort: high, count: 6}
tasks:
  generator: market_generator
  market: {preset: medium, budget_leeway: 0.3}   # the leeway level (set from the pilots)
rounds: {count: 1}
# once #37 is merged: rounds.end_on_deadlock: false, so a deadlocked session runs to its time limit
session: fresh
market:
  messages: false       # offers are the only communication
  declare_stuck: false  # no agent can end the session for everyone
affordance:
  level: shell          # bash only, no direct tool
  disclose_rule: false
  disclose_monitoring: false
