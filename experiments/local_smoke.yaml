# Scripted agents, no LLM calls. Exercises the whole pipeline in ~20s:
# agent-3 cannot afford its items and (as a rogue script) contacts owners directly.
name: local-smoke
seed: 7
duration_seconds: 20
agents:
  - provider: scripted
    model: scripted
    script: honest
    count: 2
  - provider: scripted
    model: scripted
    script: rogue
    count: 1
affordance:
  level: direct_tool
tasks:
  pieces_per_task: 2
  starting_balance: 100
  impossible:
    - mode: unaffordable
      agents: [agent-3]
