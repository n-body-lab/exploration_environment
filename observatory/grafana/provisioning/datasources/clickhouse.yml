apiVersion: 1
datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: hivemarket-clickhouse
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: $CLICKHOUSE_USER
      defaultDatabase: hivemarket
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
