# HiveMarket observatory: long-lived ClickHouse + MinIO + Grafana.
# Managed by `hivemarket observatory up|down|status`; started once, shared by every run.
# All data lives in bind mounts under $HIVEMARKET_DATA (default ~/hivemarket-observatory),
# so removing or upgrading these containers - even `down -v` - never deletes it.
name: hivemarket-observatory

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${HIVEMARKET_DATA}/clickhouse:/var/lib/clickhouse
      - ${HIVEMARKET_DATA}/clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "-q", "SELECT 1"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  minio:
    # MinIO stopped publishing community images in late 2025; `latest` is the last
    # published release. Any S3-compatible store works (HM_S3_* settings).
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${HIVEMARKET_DATA}/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    user: "${HM_UID:-472}:${HM_GID:-0}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/hivemarket.json
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ${HIVEMARKET_DATA}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      clickhouse: {condition: service_healthy}
    restart: unless-stopped
