[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemarket"
version = "0.1.0"
description = "Testbed for observing LLM agent swarms trading information through a sanctioned channel, and when they leave it."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
agent = ["anthropic>=2.0", "openai>=1.40"]
monitor = ["dpkt>=1.9", "inotify_simple>=1.3"]
observatory = ["minio>=7.2"]
analysis = ["numpy>=1.24", "fastembed>=0.3"]
# market_generator games (tasks.generator: market_generator); needed on the host only, not in the images.
# Not on PyPI: pinned to V0.3 + the OFFER/BUY protocol and the credit floor (b69351d). It needs Python >= 3.11; hivemarket itself still supports 3.10.
generator = ["hivemarket-generator @ git+https://github.com/n-body-lab/market_generator.git@b69351d8ee371c057514f675e26cad68485e66d7 ; python_version >= '3.11'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=2.0", "openai>=1.40", "dpkt>=1.9", "minio>=7.2", "chdb>=3", "numpy>=1.24"]

[project.scripts]
hivemarket = "hivemarket.cli:main"

[tool.setuptools.packages.find]
include = ["hivemarket*"]

[tool.setuptools.package-data]
"hivemarket.ui" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
